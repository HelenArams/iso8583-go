run:
  timeout: 3m

linters:
  enable:
    - errorlint
    - gocritic
    - gofmt
    - misspell
    - revive
    - unconvert
    - unparam

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - unparam
